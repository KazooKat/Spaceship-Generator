name: foggy_marsh
description: Foggy marsh hauler. Moss-block hull, mud HULL_DARK accent, light-gray-stained-glass fogged windows, slime-block engines, sea-lantern engine glow, tinted-glass cockpit, mossy-cobblestone wings, mangrove-log greebles, soul-lantern cold-blue running lights, packed-mud interior — cool wetland moss-and-mud marsh theme with bioluminescent fog-light accents.

blocks:
  HULL:          minecraft:moss_block
  HULL_DARK:     minecraft:mud
  WINDOW:        minecraft:light_gray_stained_glass
  ENGINE:        minecraft:slime_block
  ENGINE_GLOW:   minecraft:sea_lantern
  COCKPIT_GLASS: minecraft:tinted_glass
  WING:          minecraft:mossy_cobblestone
  GREEBLE:       minecraft:mangrove_log
  LIGHT:         minecraft:soul_lantern
  INTERIOR:      minecraft:packed_mud

preview_colors:
